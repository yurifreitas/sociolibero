[project]
name = "sociolibero"
version = "0.1.0"
description = "Evidências, textos originais e cenários político-econômicos do Brasil, com proveniência e validação"
readme = "README.md"
authors = [
    { name = "Yuri Freitas", email = "yuribzfreitas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
]

[project.scripts]
sociolibero = "sociolibero:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
